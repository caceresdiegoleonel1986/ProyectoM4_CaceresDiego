<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu resumen de tareas - Kairo Tasks</title>
    <style>
        @media (max-width: 600px) {
            .email-shell {
                width: 100% !important;
                border-radius: 0 !important;
            }

            .email-content {
                padding: 28px 20px !important;
            }
        }
    </style>
</head>

<body
    style="margin: 0; padding: 24px 12px; background-color: #f0f0ff; font-family: Arial, Helvetica, sans-serif; color: #374151;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
        <tr>
            <td align="center">
                <table role="presentation" class="email-shell" width="600" cellspacing="0" cellpadding="0" border="0"
                    style="width: 100%; max-width: 600px; overflow: hidden; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.12);">
                    <tr>
                        <td align="center"
                            style="padding: 32px 24px 24px; border-top: 6px solid #f97316; background-color: #ffffff;">
                            <img src="https://kairo-logo.s3.us-east-2.amazonaws.com/kairo-logo-full.png"
                                alt="Kairo Tasks" width="230"
                                style="display:block;max-width:100%;height:auto;border:0;margin:0 auto;" />
                        </td>
                    </tr>
                    <tr>
                        <td class="email-content" style="padding: 32px 42px 36px;">
                            <p
                                style="margin: 0 0 8px; color: #6d28d9; font-size: 13px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase;">
                                Resumen diario</p>
                            <h1 style="margin: 0 0 24px; color: #111827; font-size: 26px; line-height: 1.25;">Tus
                                tareas, bajo control</h1>
                            <div
                                style="padding: 20px 22px; background-color: #f5f3ff; border-left: 4px solid #6d28d9; border-radius: 8px; color: #374151; font-size: 16px; line-height: 1.8; white-space: pre-line;">
                                {{summary}}</div>
                            <p style="margin: 26px 0 0; color: #6b7280; font-size: 14px; line-height: 1.6;">Un pequeño
                                paso cada día hace que todo avance. Nos vemos en Kairo Tasks.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center"
                            style="padding: 18px 24px; background-color: #fafafa; border-top: 1px solid #e5e7eb; color: #9ca3af; font-size: 12px; line-height: 1.5;">
                            © 2026 Kairo Tasks · Organiza tu día con nosotros
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
