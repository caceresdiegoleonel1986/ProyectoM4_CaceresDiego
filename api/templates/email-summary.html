<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #2563eb;
            /* azul eléctrico */
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .logo {
            max-width: 120px;
            margin-bottom: 10px;
        }

        .content {
            padding: 20px;
            color: #333333;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #888888;
            padding: 15px;
        }

        /* ✅ Bloque responsive separado */
        @media (max-width: 600px) {
            .container {
                width: 100%;
                margin: 0;
                border-radius: 0;
            }

            .header {
                padding: 15px;
            }

            .content {
                padding: 15px;
                font-size: 14px;
            }

            .logo {
                max-width: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="https://mi-primer-react.vercel.app/kairo-logo-full.png" alt="Logo Kairo Tasks" class="logo" />
            <h2>Kairo Tasks</h2>
        </div>
        <div class="content">
            <h3>✨ Tu resumen de tareas</h3>
            <p>{{summary}}</p>
        </div>
        <div class="footer">
            © 2026 Kairo Tasks · Organiza tu día con nosotros
        </div>
    </div>
</body>

</html>
